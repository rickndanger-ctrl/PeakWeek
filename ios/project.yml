name: PeakWeekClient
options:
  bundleIdPrefix: com.peakweek
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  PeakWeekCore:
    path: ..
targets:
  PeakWeekClient:
    type: application
    platform: iOS
    sources:
      - PeakWeekClient
    dependencies:
      - package: PeakWeekCore
        product: PeakWeekCore
    info:
      path: PeakWeekClient/Info.plist
      properties:
        CFBundleDisplayName: PeakWeek
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSCameraUsageDescription: Record your sets to send to your coach.
        NSMicrophoneUsageDescription: Audio for your set videos.
        BGTaskSchedulerPermittedIdentifiers: [com.peakweek.client.refresh]
        UIBackgroundModes: [fetch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peakweek.client
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7FQA384X2F
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
